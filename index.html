<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GottaVital - Sueroterapia a Domicilio Medellín</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Satoshi:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cyan:#00E5FF;--violet:#7C3AED;--lime:#AAFF00;--pink:#FF3CAC;
    --dark:#0A0A0F;--card:#13131A;
    --text:#F0F0FF;--muted:#8888AA;
    --grad:linear-gradient(135deg,#00E5FF,#7C3AED,#FF3CAC)
  }
  html{scroll-behavior:smooth}
  body{font-family:'Satoshi',sans-serif;background:var(--dark);color:var(--text);overflow-x:hidden}
  h1,h2,h3{font-family:'Clash Display',sans-serif}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.8);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.05)}
  .logo{font-size:1.5rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  
  .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center;background:radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--dark) 100%)}
  .hero h1{font-size:clamp(2.5rem, 8vw, 5rem);line-height:1;margin-bottom:1.5rem;letter-spacing:-2px}
  .hero p{font-size:1.2rem;color:var(--muted);max-width:600px;margin-bottom:2rem}
  
  .btn-main{padding:1rem 2.5rem;border-radius:50px;background:var(--grad);color:white;text-decoration:none;font-weight:700;transition:transform 0.3s;border:none;cursor:pointer;display:inline-block}
  .btn-main:hover{transform:scale(1.05)}
  .btn-main:disabled{opacity:0.5;cursor:not-allowed;transform:none}

  .container{max-width:1100px;margin:0 auto;padding:4rem 1.5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:1.5rem;margin-top:2rem}

  .card{background:var(--card);padding:2rem;border-radius:24px;border:1px solid rgba(255,255,255,0.05);transition:all 0.3s;position:relative;cursor:pointer}
  .card:hover{border-color:var(--cyan);transform:translateY(-5px)}
  .card h3{font-size:1.5rem;margin:1rem 0}
  .card .precio{font-size:1.8rem;font-weight:700;color:var(--cyan);margin-bottom:1rem;display:block}
  .card .desc{color:var(--muted);font-size:0.95rem;line-height:1.6;margin-bottom:1.5rem}

  .selector-qty{display:flex;align-items:center;gap:1rem;margin-top:1rem}
  .qty-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--muted);background:none;color:white;cursor:pointer;font-size:1.2rem}
  .qty-val{font-weight:700;font-size:1.2rem;min-width:20px;text-align:center}

  .check-box{position:absolute;top:1.5rem;right:1.5rem;width:28px;height:28px;border:2px solid var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:0.3s}
  .card.selected{border-color:var(--cyan);background:rgba(0,229,255,0.02)}
  .card.selected .check-box{background:var(--cyan);border-color:var(--cyan)}
  .card.selected .check-box::after{content:'✓';color:var(--dark);font-weight:900}

  .resumen-fixed{position:sticky;top:100px;background:var(--card);padding:2rem;border-radius:24px;border:1px solid var(--cyan);height:fit-content}
  .resumen-linea{display:flex;justify-content:space-between;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid rgba(255,255,255,0.05)}
  .total-box{margin-top:1.5rem;padding-top:1.5rem;border-top:2px solid var(--cyan);display:flex;justify-content:space-between;font-size:1.5rem;font-weight:700}
  
  /* Inputs de datos */
  .input-datos{width:100%;padding:0.8rem;margin-bottom:0.8rem;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:white;font-family:'Satoshi',sans-serif;outline:none}
  .input-datos:focus{border-color:var(--cyan)}

  @media (max-width: 768px){
    .grid-main{display:flex;flex-direction:column}
    .resumen-fixed{position:fixed;bottom:0;left:0;right:0;top:auto;border-radius:24px 24px 0 0;z-index:1000;box-shadow:0 -10px 30px rgba(0,0,0,0.5)}
    .container{padding-bottom:300px}
  }
</style>
</head>
<body>

<nav>
  <div class="logo">GottaVital</div>
  <a href="https://wa.me/573225625668" class="btn-main" style="padding:0.5rem 1.2rem; font-size:0.9rem">WhatsApp</a>
</nav>

<section class="hero">
  <h1>Sueroterapia <br><span style="color:var(--cyan)">a Domicilio</span></h1>
  <p>Recupera tu energía en Medellín. Elige tu suero y agendamos tu visita.</p>
  <a href="#cotizador" class="btn-main">Armar mi pedido</a>
</section>

<div class="container" id="cotizador">
  <div style="display:grid; grid-template-columns: 1fr 350px; gap:2rem;" class="grid-main">
    
    <div>
      <h2 style="font-size:2.5rem; margin-bottom:2rem">Nuestros Sueros 💧</h2>
      <div id="productos-grid" class="grid"></div>
    </div>

    <aside>
      <div class="resumen-fixed">
        <h3>📋 Resumen de Pedido</h3>
        
        <div style="margin: 1.5rem 0; padding: 1rem; background:rgba(255,255,255,0.03); border-radius:15px; border:1px dashed var(--cyan)">
          <input type="text" id="cliente-nombre" class="input-datos" placeholder="Tu nombre">
          <input type="text" id="cliente-sector" class="input-datos" placeholder="Sector / Barrio">
        </div>

        <div id="resumen-lineas"></div>
        
        <div class="total-box">
          <span>Total</span>
          <span id="total-num" style="color:var(--cyan)">$0</span>
        </div>

        <button id="btn-cotizar" class="btn-main" style="width:100%; margin-top:1.5rem" disabled>
          Enviar a WhatsApp
        </button>
      </div>
    </aside>

  </div>
</div>

<script>
const WA = "573225625668";

const productos = [
  {id:'energia',   emoji:'⚡', nombre:'Energía & Vitalidad',      desc:'Complejo B y Vitamina C.', precio:120000},
  {id:'inmune',    emoji:'🛡️', nombre:'Refuerzo Inmune',           desc:'Vitamina C y Zinc.', precio:120000},
  {id:'belleza',   emoji:'✨', nombre:'Glow & Belleza',            desc:'Biotina y Colágeno.', precio:120000},
  {id:'deportivo', emoji:'🏃', nombre:'Recuperación Deportiva',    desc:'Aminoácidos y electrolitos.', precio:120000},
  {id:'hidratacion',emoji:'💧', nombre:'Hidratación Express',      desc:'Reposición inmediata.', precio:120000},
  {id:'mental',    emoji:'🧠', nombre:'Enfoque Mental',            desc:'Magnesio y antioxidantes.', precio:120000}
];

let estado = {};
productos.forEach(p => estado[p.id] = { sel: false, qty: 1 });

function fmt(num) {
  return '$' + num.toLocaleString('es-CO');
}

function render() {
  const grid = document.getElementById('productos-grid');
  grid.innerHTML = productos.map(p => `
    <div class="card ${estado[p.id].sel ? 'selected' : ''}" onclick="toggleSelect('${p.id}')">
      <div class="check-box"></div>
      <span style="font-size:2.5rem">${p.emoji}</span>
      <h3>${p.nombre}</h3>
      <p class="desc">${p.desc}</p>
      <span class="precio">${fmt(p.precio)}</span>
      
      ${estado[p.id].sel ? `
        <div class="selector-qty" onclick="event.stopPropagation()">
          <button class="qty-btn" onclick="cambiarQty('${p.id}', -1)">-</button>
          <span class="qty-val">${estado[p.id].qty}</span>
          <button class="qty-btn" onclick="cambiarQty('${p.id}', 1)">+</button>
        </div>
      ` : ''}
    </div>
  `).join('');
  actualizarResumen();
}

function toggleSelect(id) {
  estado[id].sel = !estado[id].sel;
  if(!estado[id].sel) estado[id].qty = 1;
  render();
}

function cambiarQty(id, delta) {
  estado[id].qty = Math.max(1, estado[id].qty + delta);
  render();
}

function actualizarResumen() {
  const sel = productos.filter(p => estado[p.id].sel);
  const lineas = document.getElementById('resumen-lineas');
  const totalEl = document.getElementById('total-num');
  const btn = document.getElementById('btn-cotizar');

  if(sel.length === 0) {
    lineas.innerHTML = '<p style="color:var(--muted); text-align:center; padding:1rem">Selecciona tus sueros</p>';
    totalEl.textContent = '$0';
    btn.disabled = true;
    return;
  }

  let total = 0;
  lineas.innerHTML = sel.map(p => {
    const sub = p.precio * estado[p.id].qty;
    total += sub;
    return `
      <div class="resumen-linea">
        <span>${p.nombre} ${estado[p.id].qty > 1 ? 'x'+estado[p.id].qty : ''}</span>
        <span>${fmt(sub)}</span>
      </div>
    `;
  }).join('');

  totalEl.textContent = fmt(total);
  btn.disabled = false;

  btn.onclick = () => {
    const nombre = document.getElementById('cliente-nombre').value || "No especificado";
    const sector = document.getElementById('cliente-sector').value || "No especificado";

    const pedidoTxt = sel.map(p => 
      `- ${p.nombre}${estado[p.id].qty > 1 ? ' (x' + estado[p.id].qty + ')' : ''}`
    ).join('\n');

    const msg = encodeURIComponent(
      `¡Hola GottaVital! 💧\n\n` +
      `*NUEVO PEDIDO*\n` +
      `👤 *Nombre:* ${nombre}\n` +
      `📍 *Sector:* ${sector}\n\n` +
      `*SUEROS:* \n${pedidoTxt}\n\n` +
      `*TOTAL:* ${fmt(total)}\n\n` +
      `¿Me pueden confirmar disponibilidad?`
    );
    window.open(`https://wa.me/${WA}?text=${msg}`, '_blank');
  };
}

render();
</script>
</body>
</html>
